# Publica el sitio en GitHub Pages en cada push a main.
# Dirección: https://gonzalo-lozg.me/castora
# Con dominio propio: cambiar SITE_URL a https://castorape.com, dejar BASE_PATH vacío
# y agregar el dominio en Settings → Pages.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: https://gonzalo-lozg.me/castora
  NEXT_PUBLIC_BASE_PATH: /castora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` genera antes las imágenes WebP (prebuild) y exporta a ./out
      - name: Build
        run: npm run build

      # Sin Jekyll: Pages debe servir tal cual las carpetas que empiezan con «_» (_next, _img).
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
